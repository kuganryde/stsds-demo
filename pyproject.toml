[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stsds"
version = "1.0.0"
description = "Autonomous STSDS (e-Duti Setem) compliance engine: neuro-symbolic classification, deterministic duty calculation, parity-gated RPA, 7-year WORM vault"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pypdf>=4.2,<7",
  "reportlab>=4.2,<5",
  "boto3>=1.34,<2",
  "psycopg[binary]>=3.2,<4",
  "playwright>=1.46,<2",
  "pypdfium2>=4.30,<6",
  "opencv-python-headless>=4.9,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stsds = ["py.typed", "console/*", "console/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/stsds/main.py", "src/stsds/hosted.py"]  # process wiring, exercised by the docker-compose smoke test

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4"]
ignore = ["S101", "B008", "UP042", "UP031", "E731", "C408", "C416", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
